plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// CI에서는 실행 번호를 버전 코드로 사용 → 새 APK가 기존 앱 위에 업데이트 설치됨
def ciVersionCode = (System.getenv('VERSION_CODE') ?: '1') as int
def ksFile = System.getenv('KEYSTORE_FILE') ?: "${rootDir}/keystore/ytsaver-release.jks"

android {
    namespace 'com.joyong.ytsaver'
    compileSdk 35

    defaultConfig {
        applicationId 'com.joyong.ytsaver'
        minSdk 26
        targetSdk 35
        versionCode ciVersionCode
        versionName "1.0.${ciVersionCode}"
    }

    signingConfigs {
        release {
            storeFile file(ksFile)
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'ytsaver-key'
            keyAlias System.getenv('KEY_ALIAS') ?: 'ytsaver'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'ytsaver-key'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        // 유튜브 자동 번역이 막혔을 때 기기 안에서 한국어로 번역
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'

    coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // NewPipeExtractor v0.26.5 + nanojson (JitPack 전용 라이브러리라 소스에서 빌드한 jar를 포함)
    implementation files('libs/newpipe-extractor.jar', 'libs/nanojson.jar')
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'com.google.protobuf:protobuf-javalite:4.36.2'
    implementation 'org.mozilla:rhino:1.8.1'
    implementation 'org.mozilla:rhino-engine:1.8.1'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'

    // 유튜브 자동 번역이 막혔을 때 기기 안에서 한국어로 번역
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'
}
